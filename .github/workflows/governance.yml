name: Governance

permissions:
  contents: read
  pull-requests: read

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  governance:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest ruff

      - name: Lint (ruff)
        run: |
          ruff check .

      - name: Run full test suite
        run: |
          pytest -q

      - name: Run readiness smoke
        run: |
          python scripts/readiness_smoke.py

      - name: Run project memory checks
        run: |
          python scripts/project_memory.py check

      - name: Validate project memory PR changes
        if: github.event_name == 'pull_request'
        env:
          AUTOSNIPER_MEMORY_WRITE_APPROVED: ${{ contains(github.event.pull_request.labels.*.name, 'protected-memory-approved') && '1' || '0' }}
        run: |
          python scripts/project_memory.py check --base-ref "${{ github.event.pull_request.base.sha }}" --head-ref "${{ github.event.pull_request.head.sha }}"

      - name: Resolve tracked dataset approval
        id: dataset_approval
        env:
          GH_TOKEN: ${{ github.token }}
          PR_APPROVED: ${{ github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'tracked-dataset-changes-approved') && 'true' || 'false' }}
        run: |
          approved="$PR_APPROVED"
          if [[ "${{ github.event_name }}" == "push" ]]; then
            labels="$(gh api "repos/${{ github.repository }}/commits/${{ github.sha }}/pulls" \
              --jq '.[].labels[].name')"
            if grep -Fxq 'tracked-dataset-changes-approved' <<< "$labels"; then
              approved="true"
            else
              approved="false"
            fi
          fi
          echo "approved=$approved" >> "$GITHUB_OUTPUT"

      - name: Run governed checks
        if: steps.dataset_approval.outputs.approved != 'true'
        env:
          GOVERNANCE_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          python scripts/governance_checks.py check --publish-summary

      - name: Run governed checks with approved dataset snapshot
        if: steps.dataset_approval.outputs.approved == 'true'
        env:
          GOVERNANCE_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          python scripts/governance_checks.py check --publish-summary \
            --allow-dataset-change CSV_data/restricted/restricted_group_map.csv \
            --allow-dataset-change CSV_data/scrapers/active_vehicle_details.csv \
            --allow-dataset-change CSV_data/scrapers/active_vehicle_links.csv \
            --allow-dataset-change CSV_data/scrapers/all_vehicle_links.csv \
            --allow-dataset-change CSV_data/scrapers/excluded_listings.csv \
            --allow-dataset-change CSV_data/scrapers/normalised_data.csv \
            --allow-dataset-change CSV_data/scrapers/pipeline_exclusions.csv \
            --allow-dataset-change CSV_data/scrapers/raw_vehicle_data.csv \
            --allow-dataset-change CSV_data/scrapers/referred_cars.csv \
            --allow-dataset-change CSV_data/scrapers/sold_cars.csv \
            --allow-dataset-change CSV_data/scrapers/vehicle_static_details.csv

      - name: Upload governance reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: governance-reports
          path: output/governance/
          if-no-files-found: ignore
