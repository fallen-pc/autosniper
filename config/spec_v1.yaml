  # -----------------------------
  # TOYOTA HILUX (CORE) - SR5 curve, SR derived
  # -----------------------------
  - group_id: toyota_hilux_dualcab_ute_diesel_auto_sr5_4x4_2005_2014
    status: CORE
    series_allowed: [KUN26R]
    series_year_guard:
      KUN26R: {year_min: 2005, year_max: 2014}
    rules:
      make: TOYOTA
      model: HILUX
      body: [DUAL_CAB_UTE]
      fuel: [DIESEL]
      transmission: [AUTO]
      drivetrain: [4X4]
      trim: [SR5]
    hard_excludes:
      title_tokens_any: ["hi-rider", "hi rider"]
      drivetrain_tokens_any: ["4x2", "2wd"]
      body_tokens_any: ["cab chassis", "single cab", "extra cab", "space cab"]
    curve_requirements:
      anchor_years: [2006, 2012]
      km_anchors: [50000, 120000, 200000, 260000]
    pricing:
      derived_trim_adjustments:
        - trim: SR
          derived_from_group_id: toyota_hilux_dualcab_ute_diesel_auto_sr5_4x4_2005_2014
          method: percentage_discount_by_series
          discount_by_series:
            KUN26R: 0.08
          clamp:
            min_price: 0

  - group_id: toyota_hilux_dualcab_ute_diesel_auto_sr5_4x4_2015_2023
    status: CORE
    series_allowed: [GUN126R]
    series_year_guard:
