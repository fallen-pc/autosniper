    category: replacement
    severity_hint: low

  - pattern: "\\bbonnet struts?.*(don.?t work|doesn.?t work|not working|requires attention|needs attention|broken|fault)"
    canonical_defect: bonnet_strut_damage
    category: replacement
    severity_hint: medium

  - pattern: "\\bservice (due|required) message on dash\\b"
