    severity_hint: low

  - pattern: "\\b(door card|doorcards|door trim|carpet|flooring|hood lining|headlining|trim).*(worn|sagging|marks|stain|stained|tear|torn|holes|broken|peeling|faded|requires attention|require attention)"
    canonical_defect: interior_trim_damage
    category: interior
    severity_hint: low

  - pattern: "\\b(aerial).*(requires attention|require attention|needs attention|broken|missing|damaged)"
