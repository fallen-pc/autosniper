  - pattern: "\\b(brake light|reversing light|reverse light|fog light|foglight).*(condensation|condensed|crack|cracked|damage|damaged|not working|requires attention)|\\b(condensation|condensed|crack|cracked|damage|damaged).*(brake light|reversing light|reverse light|fog light|foglight)"
