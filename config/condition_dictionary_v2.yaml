    category: interior
    severity_hint: low

  - pattern: "\\bhandbrake\\b.*\\bworn\\b"
    canonical_defect: interior_trim_damage
    category: interior
    severity_hint: low

  - pattern: "\\b(dash|dashboard).*(torn|cracked|crack|damage|damaged)"
    canonical_defect: interior_trim_damage
    category: interior
    severity_hint: low

  - pattern: "\\b(stain|stained|stains).*(centre console|center console|roof liner)|\\b(dash|dashboard).*(stain|stained|sticky residue)|\\bsticky residue on (?:the )?dashboard\\b"
    canonical_defect: interior_trim_damage
    category: interior
    severity_hint: low

  - pattern: "\\bcoating on (?:the )?console coming off\\b"
    canonical_defect: interior_trim_damage
    category: interior
    severity_hint: low

  - pattern: "\\bholes? (?:on|in) (?:the )?carpet\\b"
