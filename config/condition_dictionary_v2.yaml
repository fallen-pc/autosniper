version: 2

categories:
  - cosmetic
  - glass
  - replacement
  - structural
  - mechanical
  - interior
  - boilerplate

repair_clusters:
  - body_panel
  - paint_repair
  - hail_repair
  - glass_replace
  - interior_trim
  - structural_body
  - engine_fault
  - drivetrain_fault
  - suspension_fault

entries:
  - raw_phrase: "refer to photos"
    canonical_defect: boilerplate_refer_photos
    category: boilerplate
    severity_hint: low

  - raw_phrase: "arrange inspection"
    canonical_defect: boilerplate_arrange_inspection
    category: boilerplate
    severity_hint: low

  - pattern: "\\b(location|address)\\b"
    canonical_defect: boilerplate_location
    category: boilerplate
    severity_hint: low

  - pattern: "\\b(vic|nsw|qld|sa|wa|tas|act|nt)\\b"
    canonical_defect: boilerplate_state
    category: boilerplate
    severity_hint: low

  - pattern: "^\\d{4}$"
    canonical_defect: boilerplate_postcode
    category: boilerplate
    severity_hint: low

  - pattern: "\\b(dandenong south)\\b"
    canonical_defect: boilerplate_suburb
    category: boilerplate
    severity_hint: low

  - pattern: "\\b(key no|key number)\\b"
    canonical_defect: boilerplate_key_no
    category: boilerplate
    severity_hint: low

  - pattern: "^\\s*(key|spare key|owners manual|service history|engine turns over)\\s*:\\s*(yes|no|partial|digital|unknown|n/?a)\\.?\\s*$"
    canonical_defect: boilerplate_vehicle_metadata
    category: boilerplate
    severity_hint: low

  - pattern: "^\\s*(driveable\\s*:\\s*yes|registration expires\\s*:.*|plates come with vehicle|sold unregistered(?: without plates)?|untested (?:and|&) unregistered)\\.?\\s*$"
    canonical_defect: boilerplate_vehicle_metadata
    category: boilerplate
    severity_hint: low

  - pattern: "^\\s*1 ownerlog books includedservice records includedregistration:sold registered to all buyers\\.?\\s*$"
    canonical_defect: boilerplate_vehicle_metadata
    category: boilerplate
    severity_hint: low

  - pattern: "^\\s*(registered vehicles will only be transferred to .* license holders|vehicles will be sold unregistered to interstate buyers)\\.?\\s*$"
    canonical_defect: boilerplate_registration_terms
    category: boilerplate
    severity_hint: low

  - pattern: "^\\s*(dvd player untested|low fuel|bluetooth|tow bar)\\.?\\s*$"
    canonical_defect: boilerplate_vehicle_metadata
    category: boilerplate
    severity_hint: low

  - pattern: "^\\s*(suitability|inclusions|and any faults|any descriptions|photographs|by placing a bid|nan)\\.?\\s*$"
    canonical_defect: boilerplate_joiner_noise
    category: boilerplate
    severity_hint: low

  - pattern: "^\\s*(please handle with care|or information provided are intended as a guide only and do not constitute a warranty or guarantee|the buyer acknowledges they have had the opportunity to inspect the asset and accept it in its current condition|subject to any rights and remedies that cannot be excluded under the australian consumer law)\\.?\\s*$"
    canonical_defect: boilerplate_auction_disclaimer
    category: boilerplate
    severity_hint: low

  - pattern: "\\b(security interest|ppsr check|business days|registration to be removed|monies are cleared)\\b"
    canonical_defect: boilerplate_ppsr_security_interest
    category: boilerplate
    severity_hint: low

  - pattern: "\\b(ppsr attached|state-based road authority|roadworthy condition|salvage auction|as is|where is|mechanical inspection|grays does not conduct|repairs or maintenance|inspection is highly recommended|extra parts not listed|jump pack to start on collection)\\b"
    canonical_defect: boilerplate_salvage_wovr_disclaimer
    category: boilerplate
    severity_hint: low

  - pattern: "\\b(inspection highly recommended|inspection advised before bidding|strongly encouraged to inspect)\\b"
    canonical_defect: boilerplate_arrange_inspection
    category: boilerplate
    severity_hint: low

  - pattern: "^\\s*sold as salvage vehicle\\.?\\s*$"
    canonical_defect: salvage_vehicle
    category: structural
    severity_hint: high

  - pattern: "^\\s*(cab|body|seat|trim|brake|paint|carpet|interior|rust) condition\\s*:?\\s*(good|excellent|nil)\\.?\\s*$"
    canonical_defect: boilerplate_vehicle_metadata
    category: boilerplate
    severity_hint: low

  - pattern: "^.*\\s-\\snull\\.?\\s*$"
    canonical_defect: body_location_list
    category: boilerplate
    severity_hint: low

  - pattern: "^\\s*steering wheel\\.?\\s*$"
    canonical_defect: body_location_list
    category: boilerplate
    severity_hint: low

  - pattern: "\\b(a?salvage auction|public liability certificate|workers compensation certificate|high risk license|swms|legislative requirements|released gasses|therefore|stored\\.?$|new south wales)\\b"
    canonical_defect: boilerplate_safety_removal_disclaimer
    category: boilerplate
    severity_hint: low

  - pattern: "\\b(mine site vehicle|ex[- ]?rental|taxi|police vehicle)\\b"
    canonical_defect: usage_risk_history
    category: boilerplate
    severity_hint: low

  - pattern: "^\\s*(and|or|therefore)\\.?\\s*$"
    canonical_defect: boilerplate_joiner_noise
    category: boilerplate
    severity_hint: low

  - pattern: "\\b(crash test|ancap)\\b"
    canonical_defect: boilerplate_crash_rating
    category: boilerplate
    severity_hint: low

  - pattern: "\\b(air conditioning|cd player|central locking|power steering|driver airbag|park distance control|electric windows|multi function steering wheel|abs brakes|hill holder system|alloy wheels|leather trim)\\b"
    canonical_defect: boilerplate_feature_list
    category: boilerplate
    severity_hint: low

  - pattern: "\\b(windscreen|windshield).*(crack|cracked|chip|chipped)"
    canonical_defect: windscreen_damage
    category: glass
    severity_hint: medium

  - pattern: "\\b(crack|cracked|chip|chipped).*(windscreen|windshield)"
    canonical_defect: windscreen_damage
    category: glass
    severity_hint: medium

  - pattern: "\\b(windscreen|windshield).*(pitting|pit|pitted)"
    canonical_defect: windscreen_damage
    category: glass
    severity_hint: low

  - pattern: "\\b(windscreen|windshield).*(requires attention|needs attention)"
    canonical_defect: windscreen_damage
    category: glass
    severity_hint: medium

  - pattern: "\\b(window|glass).*(crack|cracked|chip|chipped|broken)"
    canonical_defect: window_damage
    category: glass
    severity_hint: medium

  - pattern: "\\b(tint).*(requires attention|needs attention|peel|peeling|damage|damaged|bubbling)"
    canonical_defect: window_tint_damage
    category: glass
    severity_hint: low

  - pattern: "\\b(window|glass).*(smashed)"
    canonical_defect: window_damage
    category: glass
    severity_hint: medium

  - pattern: "\\b(hail)\\b"
    canonical_defect: hail_damage
    category: structural
    severity_hint: high

  - pattern: "\\b(chassis|frame|structural|chassis rail|frame rail|structural rail|cant rail)\\b|\\b[abc][ -]?pillars?\\b(?!\\s+trim)"
    canonical_defect: structural_damage
    category: structural
    severity_hint: high

  - pattern: "\\b(engine).*(rattle|knock|smoke|leak|overheat|overheating|idling rough|lacks power)"
    canonical_defect: engine_fault
    category: mechanical
    severity_hint: high

  - pattern: "\\b(transmission|gearbox).*(slip|slipping|fault|issue)"
    canonical_defect: transmission_fault
    category: mechanical
    severity_hint: high

  - pattern: "\\b(flat battery|jump start|towing required)\\b"
    canonical_defect: battery_issue
    category: mechanical
    severity_hint: medium

  - pattern: "\\bbattery\\b.*\\b(flat|requires attention|missing|dead)\\b"
    canonical_defect: battery_issue
    category: mechanical
    severity_hint: medium

  - pattern: "\\b(controls broken|heater control|heater broken)\\b"
    canonical_defect: control_damage
    category: interior
    severity_hint: medium

  - pattern: "\\b(controls? inoperable|climate controls?).*"
    canonical_defect: control_damage
    category: interior
    severity_hint: medium

  - pattern: "\\b(radio|stereo|infotainment|sat nav|navigation|a/c|air conditioning).*(not working|inoperative|fault|faulty|broken)"
    canonical_defect: control_damage
    category: interior
    severity_hint: medium

  - pattern: "\\b(odometer).*(not working|inaccurate|fault|faulty|inoperative)"
    canonical_defect: control_damage
    category: interior
    severity_hint: medium

  - pattern: "\\b(warning lights?|engine lights?|abs|airbag)\\b.*\\b(on|flashing|warning)\\b"
    canonical_defect: warning_light
    category: mechanical
    severity_hint: high

  - pattern: "\\b(seat).*(torn|tear|worn|stain|stained)"
    canonical_defect: seat_damage
    category: interior
    severity_hint: low

  - pattern: "\\bseats?\\b"
    canonical_defect: seat_issue
    category: interior
    severity_hint: low

  - pattern: "\\b(steering wheel|steering|gear knob|gearshift|shift knob|centre console|center console|roof lining|rooflining|head lining|roof liner).*(worn|broken|missing|sagging|tear|torn|cracked|misaligned|stain|stained|requires attention)"
