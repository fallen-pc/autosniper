    category: replacement
    severity_hint: medium

  - pattern: "\\b(tail light|taillight|indicator|reflector|fog light|foglight|dome light).*(crack|cracked|broken|missing|damaged|flicker|flickering)|\\b(crack|cracked|broken|missing|damaged).*\\b(tail light|taillight|indicator|reflector|fog light|foglight)"
