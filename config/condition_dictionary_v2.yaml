    category: replacement
    severity_hint: medium

  - pattern: "\\b(?:(mirror|headlight|head light).*(crack|cracked|broken|missing|damaged|requires attention)|(crack|cracked|broken|missing|damaged).*\\b(mirror|headlight|head light))"
    canonical_defect: mirror_light_damage
    category: replacement
    severity_hint: medium

  - pattern: "\\b(?:(headlights?|head lights?).*(hazy|hazed|faded|cloudy)|(hazy|hazed|faded|cloudy).*\\b(headlights?|head lights?))"
    canonical_defect: lighting_damage
    category: replacement
    severity_hint: medium

  - pattern: "\\b(condensed|condensation).*(brake ?light|tail ?light)|\\b(brake ?light|tail ?light).*(condensed|condensation)"
    canonical_defect: lighting_condensation_damage
    category: replacement
    severity_hint: medium

  - pattern: "\\bdoor handle\\b.*\\b(not working|broken|missing|damaged|requires attention|worn)"
    canonical_defect: door_handle_damage
    category: replacement
    severity_hint: medium

  - pattern: "\\b(fuel flap|fuel door|fuel cap release).*(broken|missing|damaged|requires attention|needs attention|cannot open|unable to open|stuck)"
